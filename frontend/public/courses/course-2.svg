<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- Decorative geometric accents -->
  <circle cx="720" cy="80" r="180" fill="#818cf8" opacity="0.08"/>
  <circle cx="80" cy="400" r="140" fill="#818cf8" opacity="0.06"/>
  <rect x="0" y="438" width="800" height="12" fill="url(#badgeGrad)"/>

  <!-- Top Logo & Tag Row -->
  <g transform="translate(45, 45)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
    <text x="18" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INDRAJEET SIR UPSC</text>
    
    <!-- Badge -->
    <rect x="235" y="0" width="180" height="32" rx="16" fill="url(#badgeGrad)"/>
    <text x="325" y="21" text-anchor="middle" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" letter-spacing="1">MAINS INTENSIVE</text>
  </g>

  <!-- Course Titles -->
  <text x="45" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">Mains Mentorship 2026/27</text>
  <text x="45" y="168" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600">Comprehensive GS 1-4 & Answer Writing Mastery</text>

  <!-- Divider Line -->
  <line x1="45" y1="190" x2="520" y2="190" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Key Bullets -->
  <g transform="translate(45, 218)">
    
    <g transform="translate(0, 0)">
      <circle cx="12" cy="0" r="10" fill="url(#badgeGrad)"/>
      <path d="M7 -2 L10 2 L16 -4" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">600+ Topic Short Note Making Framework</text>
    </g>
    <g transform="translate(0, 38)">
      <circle cx="12" cy="0" r="10" fill="url(#badgeGrad)"/>
      <path d="M7 -2 L10 2 L16 -4" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Deep 12-Year PYQ Trend Analysis & Structural Hacks</text>
    </g>
    <g transform="translate(0, 76)">
      <circle cx="12" cy="0" r="10" fill="url(#badgeGrad)"/>
      <path d="M7 -2 L10 2 L16 -4" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="5" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Toppers Copy Structural & Presentation Reverse-Engineering</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(45, 365)">
    <rect x="0" y="0" width="460" height="42" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.15)"/>
    <text x="18" y="26" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800">1-on-1 Direct Mentorship</text>
    <text x="210" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">• Live Portal &amp; Android App Access</text>
  </g>

  <!-- Right Visual / Mentor Seal Card -->
  <g transform="translate(545, 75)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="210" height="310" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    
    <!-- Inner Portrait Glow Circle -->
    <circle cx="105" cy="115" r="75" fill="rgba(255,255,255,0.05)" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="105" cy="115" r="65" fill="#3730a3"/>
    
    <!-- Mentor Icon / Monogram -->
    <text x="105" y="112" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="1">IS</text>
    <text x="105" y="134" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">MENTOR</text>

    <!-- Name & Faculty Tag -->
    <text x="105" y="222" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="850">Indrajeet Sir</text>
    
    <rect x="25" y="238" width="160" height="26" rx="13" fill="rgba(37,99,235,0.3)" stroke="#60a5fa" stroke-width="1"/>
    <text x="105" y="255" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">VisionIAS Faculty</text>

    <text x="105" y="286" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">4x UPSC Mains Written</text>
  </g>
</svg>